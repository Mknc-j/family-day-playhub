    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      color: var(--sn-ink);
      background:
        linear-gradient(rgba(246, 252, 249, 0.88), rgba(238, 247, 242, 0.94)),
        var(--brand-gradient) center / cover fixed;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      padding: max(14px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    .app {
      width: min(100%, 520px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      height: 46px;
      padding: 0 16px;
      border: 2px solid var(--sn-line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--sn-deep);
    }

    .brand-logo {
      display: block;
      width: 144px;
      height: auto;
    }

    .language {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 2px solid var(--sn-line);
      border-radius: 999px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .language button {
      min-width: 54px;
      min-height: 40px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--sn-deep);
      font-weight: 800;
      cursor: pointer;
    }

    .language button.active {
      background: var(--sn-green);
      color: white;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .panel {
      border: 3px solid var(--sn-deep);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 4px 4px 0 var(--sn-deep), var(--shadow);
    }

    .welcome {
      position: relative;
      overflow: hidden;
      padding: 18px;
    }

    .welcome::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--brand-pattern) center / cover;
      opacity: 0.16;
      pointer-events: none;
    }

    .welcome > * {
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 7vw, 2.35rem);
      line-height: 1.05;
      letter-spacing: 0;
      color: var(--sn-deep);
    }

    .lead {
      margin: 10px 0 0;
      color: #42635c;
      font-size: 1rem;
      line-height: 1.45;
      font-weight: 700;
    }

    .level-grid {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .level-card {
      width: 100%;
      min-height: 112px;
      display: grid;
      grid-template-columns: 58px 1fr;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 3px solid var(--sn-deep);
      border-radius: 8px;
      background: var(--card);
      color: var(--sn-ink);
      text-align: left;
      box-shadow: 3px 3px 0 var(--sn-deep);
      cursor: pointer;
    }

    .level-icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border: 3px solid var(--sn-deep);
      border-radius: 8px;
      background: linear-gradient(135deg, var(--sn-bright), var(--sn-green));
      color: var(--sn-deep);
      font-size: 1.5rem;
      font-weight: 900;
    }

    .level-title {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      font-size: 1.12rem;
      font-weight: 900;
      color: var(--sn-deep);
    }

    .level-age {
      color: var(--sn-green);
      font-size: 0.82rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .level-copy {
      margin: 4px 0 0;
      color: #4b675f;
      font-size: 0.92rem;
      line-height: 1.32;
      font-weight: 700;
    }

    .battle-hud {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    .status-panel {
      padding: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .tiny-label {
      font-size: 0.74rem;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--sn-deep);
    }

    .progress-track, .hp-track {
      height: 10px;
      overflow: hidden;
      border: 2px solid var(--sn-deep);
      border-radius: 999px;
      background: #e8f0ed;
    }

    .progress-track { margin-top: 8px; }

    .progress-fill, .hp-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--sn-bright), var(--sn-green));
      transition: width 240ms ease;
    }

    .hp-fill.low { background: linear-gradient(90deg, var(--warning), var(--danger)); }

    .stage {
      overflow: hidden;
      border: 3px solid var(--sn-deep);
      border-radius: 8px;
      background:
        repeating-linear-gradient(0deg, #ffffff 0, #ffffff 10px, #eef4f1 11px, #eef4f1 14px);
      box-shadow: inset 0 0 0 5px rgba(22, 160, 93, 0.12), var(--shadow);
    }

    .stage-grid {
      display: grid;
      grid-template-columns: minmax(116px, 0.86fr) minmax(170px, 1.14fr);
      grid-template-areas: "hero enemy";
      align-items: end;
      min-height: 275px;
      padding: 16px 12px 14px;
    }

    .sprite-wrap.enemy { grid-area: enemy; justify-self: end; width: min(100%, 255px); }
    .sprite-wrap.hero { grid-area: hero; justify-self: start; width: min(100%, 255px); }

    .sprite {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 8px 0 rgba(18, 63, 74, 0.13));
    }

    .monster-sprite {
      image-rendering: pixelated;
    }

    .nameplate {
      margin-top: -2px;
      padding: 8px 10px;
      border: 3px solid var(--sn-deep);
      border-radius: 8px;

      font-size: 0.72rem;
      font-weight: 900;
    }

    .question-panel {
      margin-top: 12px;
      padding: 14px;
      font-size: 1.03rem;
      font-weight: 900;
      line-height: 1.35;
    }

    .answers {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .answer {
      min-height: 58px;
      padding: 13px 14px;
      border: 2px solid var(--sn-line);
      border-radius: 8px;
      background: var(--card);
      color: var(--sn-ink);
      text-align: left;
      font-weight: 800;
      line-height: 1.3;
      cursor: pointer;
    }

    .answer:not([disabled]):active {
      transform: translateY(1px);
    }

    ruby {
      ruby-position: over;
    }

    rt {
      color: var(--sn-deep);
      font-size: 0.58em;
      font-weight: 900;
      line-height: 1;
    }

    .answer.correct {
      border-color: var(--sn-green);
      background: #e9f8ed;
      color: #0a7040;
    }

    .answer.wrong {
      border-color: var(--danger);
      background: #fff0ef;
      color: #a9231e;
    }

    .feedback {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border-radius: 8px;
      background: #eaf7ee;
      border: 2px solid var(--sn-green);
      line-height: 1.42;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .feedback.active { display: block; }
    .feedback.bad { background: #fff2f0; border-color: var(--danger); }
    .feedback strong { display: block; margin-bottom: 4px; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .primary, .secondary {
      min-height: 52px;
      border: 0;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary {
      background: var(--sn-green);
      color: white;
    }

    .secondary {
      border: 2px solid var(--sn-deep);
      background: var(--card);
      color: var(--sn-deep);
    }

    .primary[hidden], .secondary[hidden] { display: none; }

    .result {
      padding: 20px;
      text-align: center;
    }

    .result-score {
      margin: 12px auto;
      width: 128px;
      height: 128px;
      display: grid;
      place-items: center;
      border: 4px solid var(--sn-deep);
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sn-bright), var(--sn-green));
      color: var(--sn-deep);
      font-size: 2rem;
      font-weight: 900;
      box-shadow: 4px 4px 0 var(--sn-deep);
    }

    .note {
      margin-top: 12px;
      color: #547269;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.4;
    }

    @media (max-width: 430px) {
      body { padding-left: 12px; padding-right: 12px; }
      .brand { height: 42px; padding: 0 12px; font-size: 1.15rem; }
      .language button { min-width: 48px; min-height: 38px; }
      .welcome { padding: 14px; }
      .level-card { grid-template-columns: 50px 1fr; padding: 12px; }
      .level-icon { width: 50px; height: 50px; }
      .stage-grid {

        grid-template-areas:
          "enemy"
          "hero";
        min-height: 430px;
        gap: 4px;
      }
      .sprite-wrap.enemy { justify-self: center; width: min(86vw, 280px); }
      .sprite-wrap.hero { justify-self: start; width: min(78vw, 275px); margin-left: -12px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>

};

    const MONSTERS = [
      { name: "ELEFISH", alt: "ELEFISH, pixel-art cyber monster from the shared reference design", image: "data:image/png;base64," },
      { name: "BYTEGECKO", alt: "BYTEGECKO, pixel-art cyber monster from the shared reference design", image: "data:image/png;base64," },
      { name: "SHELLTOP", alt: "SHELLTOP, pixel-art cyber monster from the shared reference design", image: "data:image/png;base64," },
      { name: "VIRUSEER", alt: "VIRUSEER, pixel-art cyber monster from the shared reference design", image: "data:image/png;base64," },
      { name: "WISPONGE", alt: "WISPONGE, pixel-art cyber monster from the shared reference design", image: "data:image/png;base64," },
      { name: "FIREWALLER", alt: "FIREWALLER, pixel-art cyber monster from the shared reference design", image: "data:image/png;base64," }
    ];

    const state = {
      lang: "en",
      deck: [],
      index: 0,
      selected: false,
      selectedChoice: null,
      correct: 0,
      score: 0,
      monsterHp: 100,
      helperHp: 100,
      monster: MONSTERS[1],
      resultGameOver: false,
      currentLevel: "explorer"
    };

    const LEVELS = {
      explorer: { labelKey: "level1Name", questions: QUESTION_SETS.explorer },
      ranger: { labelKey: "level2Name", questions: QUESTION_SETS.ranger },
      guardian: { labelKey: "level3Name", questions: QUESTION_SETS.guardian }
    };

    const $ = (id) => document.getElementById(id);

    function t(key) {
      return TEXT[state.lang][key];
    }

    function i18nHtml(key) {
      return state.lang === "ja" && TEXT_HTML.ja[key] ? TEXT_HTML.ja[key] : escapeHtml(t(key));
    }

    function localized(value) {
      return state.lang === "ja" && value.jaHtml ? value.jaHtml : value[state.lang];
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));
    }

    function rich(value) {
      const content = localized(value);
      return state.lang === "ja" && content.includes("<ruby") ? content : escapeHtml(content);
    }

    function setRichText(node, value) {
      node.innerHTML = rich(value);
    }

    function shuffle(items) {
      const copy = items.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach((screen) => screen.classList.remove("active"));
      $(id).classList.add("active");
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function applyLanguage() {
      document.documentElement.lang = state.lang;
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        node.innerHTML = i18nHtml(node.dataset.i18n);
      });
      $("lang-en").classList.toggle("active", state.lang === "en");
      $("lang-ja").classList.toggle("active", state.lang === "ja");
      $("level-label").textContent = t(LEVELS[state.currentLevel].labelKey);
      if ($("game-screen").classList.contains("active")) renderQuestion(false);
      if ($("result-screen").classList.contains("active")) renderResultText();
    }

    function startGame(level = state.currentLevel) {
      state.currentLevel = level;
      const levelConfig = LEVELS[level];
      state.deck = shuffle(levelConfig.questions).slice(0, 5).map((question) => {
        const choices = shuffle(question.choices.map((choice, originalIndex) => ({ choice, originalIndex })));
        return { ...question, choices, correct: choices.findIndex((item) => item.originalIndex === question.correct) };
      });
      state.index = 0;
      state.selected = false;
      state.selectedChoice = null;
      state.correct = 0;
      state.score = 0;
      state.monsterHp = 100;
      state.helperHp = 100;
      state.resultGameOver = false;
      state.monster = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
      $("monster-art").innerHTML = `<img class="sprite monster-sprite" src="${state.monster.image}" alt="${state.monster.alt}" />`;
      $("monster-name").textContent = state.monster.name;
      $("level-label").textContent = t(levelConfig.labelKey);
      showScreen("game-screen");
      renderQuestion(true);
    }

    function renderBars() {
      $("monster-hp").style.width = state.monsterHp + "%";
      $("helper-hp").style.width = state.helperHp + "%";
      $("monster-hp-label").textContent = "HP " + state.monsterHp + "%";
      $("helper-hp-label").textContent = "HP " + state.helperHp + "%";
      $("monster-hp").classList.toggle("low", state.monsterHp <= 35);
      $("helper-hp").classList.toggle("low", state.helperHp <= 35);
      $("progress-fill").style.width = ((state.index) / 5) * 100 + "%";
    }

    function renderQuestion(resetSelection = true) {
      const question = state.deck[state.index];
      if (resetSelection) {
        state.selected = false;
        state.selectedChoice = null;
      }
      $("question-count").textContent = (state.lang === "ja" ? "問題 " : "Question ") + (state.index + 1) + "/5";
      setRichText($("question-text"), question.q);
      $("answers").innerHTML = "";
      $("feedback").className = "feedback";
      $("feedback").innerHTML = "";
      $("next-button").hidden = !state.selected;

      question.choices.forEach((item, choiceIndex) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.innerHTML = rich(item.choice);
        button.disabled = state.selected;
        if (state.selected && choiceIndex === question.correct) button.classList.add("correct");
        if (state.selected && choiceIndex === state.selectedChoice && choiceIndex !== question.correct) button.classList.add("wrong");
        button.addEventListener("click", () => answer(choiceIndex));
        $("answers").appendChild(button);
      });

      if (state.selected) renderFeedback();
      setNextButtonText();
      renderBars();
    }

    function answer(choiceIndex) {
      if (state.selected) return;
      state.selected = true;
      state.selectedChoice = choiceIndex;
      const question = state.deck[state.index];
      const isCorrect = choiceIndex === question.correct;
      const buttons = Array.from(document.querySelectorAll(".answer"));

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === question.correct) button.classList.add("correct");
        if (index === choiceIndex && !isCorrect) button.classList.add("wrong");
      });

      if (isCorrect) {
        state.correct += 1;
        state.score += 20;
        state.monsterHp = Math.max(0, state.monsterHp - 20);
      } else {
        state.helperHp = Math.max(0, state.helperHp - 25);
      }

      renderFeedback();
      $("next-button").hidden = false;
      renderBars();
      setNextButtonText();
    }

    function setNextButtonText() {
      if (state.helperHp === 0) {
        $("next-button").textContent = t("playAgain");
      } else if (state.index === 4 || state.monsterHp === 0) {
        $("next-button").textContent = state.lang === "ja" ? "結果を見る" : "See result";
      } else {
        $("next-button").textContent = t("next");
      }
    }

    function renderFeedback() {
      const question = state.deck[state.index];
      const choiceIndex = state.selectedChoice;
      const isCorrect = choiceIndex === question.correct;
      const feedback = $("feedback");
      feedback.className = "feedback active" + (isCorrect ? "" : " bad");
      feedback.innerHTML = "<strong>" + (isCorrect ? t("correct") : t("incorrect")) + "</strong> "
        + (state.lang === "ja" ? question.feedback.ja[question.choices[choiceIndex].originalIndex] : escapeHtml(question.feedback.en[question.choices[choiceIndex].originalIndex]))
        + "<br><br>" + rich(question.learning);
    }

    function nextStep() {
      if (state.helperHp === 0) {
        showResult(true);
        return;
      }
      if (state.index >= 4 || state.monsterHp === 0) {
        showResult(false);
        return;
      }
      state.index += 1;
      renderQuestion(true);
    }

    function showResult(gameOver) {
      state.resultGameOver = gameOver;
      renderResultText();
      showScreen("result-screen");
    }

    function renderResultText() {
      const gameOver = state.resultGameOver;
      $("result-title").textContent = gameOver ? t("gameOver") : t("victory");
      $("result-score").textContent = state.score;
      $("result-detail").textContent = gameOver
        ? t("gameOverDetail")
        : t("resultDetail").replace("{score}", state.score).replace("{correct}", state.correct);
    }

    $("lang-en").addEventListener("click", () => { state.lang = "en"; applyLanguage(); });
    $("lang-ja").addEventListener("click", () => { state.lang = "ja"; applyLanguage(); });
    document.querySelectorAll("[data-level]").forEach((button) => {
      button.addEventListener("click", () => startGame(button.dataset.level));
    });
    $("next-button").addEventListener("click", nextStep);
    $("back-button").addEventListener("click", () => showScreen("welcome-screen"));
    $("play-again").addEventListener("click", () => startGame(state.currentLevel));
    $("result-levels").addEventListener("click", () => showScreen("welcome-screen"));

    applyLanguage();
  </script>
</body>
